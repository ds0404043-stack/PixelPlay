<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Pixadu</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, sans-serif;
        }

        body {

            background: #08131f;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;

        }

        body::before {

            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, #22c55e33, transparent 70%);
            animation: rotate 15s linear infinite;

        }

        .container {

            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 700px;
            padding: 40px;

        }

        .logo {

            font-size: 55px;
            margin-bottom: 15px;

        }

        h1 {

            font-size: 55px;
            margin-bottom: 20px;

        }

        p {

            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 35px;

        }

        .progress {

            width: 100%;
            height: 12px;
            background: #1f2937;
            border-radius: 30px;
            overflow: hidden;
            margin-bottom: 30px;

        }

        .progress span {

            display: block;
            height: 100%;
            width: 65%;
            background: #22c55e;
            animation: loading 2s infinite alternate;

        }

        .btn {

            display: inline-block;
            padding: 15px 35px;
            background: #22c55e;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;

        }

        .btn:hover {

            transform: translateY(-4px);
            box-shadow: 0 0 20px #22c55e;

        }

        .small {

            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;

        }

        @keyframes loading {

            from {

                width: 35%;

            }

            to {

                width: 80%;

            }

        }

        @keyframes rotate {

            from {

                transform: rotate(0deg);

            }

            to {

                transform: rotate(360deg);

            }

        }

        .fade {

            opacity: 0;
            transform: translateY(40px);
            animation: fade .8s forwards;

        }

        @keyframes fade {

            to {

                opacity: 1;
                transform: translateY(0);

            }

        }
    </style>

</head>

<body>

    <div class="container fade">

        <div class="logo">🎮</div>

        <h1>Coming Soon</h1>

        <p>
            We're working hard to bring this game to PixelPlay.
            Stay tuned for future updates!
        </p>

        <div class="progress">
            <span></span>
        </div>

        <a href="index.html" class="btn">
            🏠 Back to Home
        </a>

        <div class="small" id="status">
            Preparing amazing things...
        </div>

    </div>

    <script>

        const messages = [

            "Preparing amazing things...",

            "Optimizing gameplay...",

            "Building the experience...",

            "Almost Ready..."

        ];

        let i = 0;

        setInterval(() => {

            i = (i + 1) % messages.length;

            document.getElementById("status").textContent = messages[i];

        }, 2500);

    </script>
    <script src="js/search-data.js"></script>
    <script src="js/search-ui.js"></script>
    <script src="js/search.js"></script>
</body>

</html>
