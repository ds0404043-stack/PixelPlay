<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pixadu | Chess</title>
    <script type="text/javascript" src="js/jquery-1.8.2.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui-1.8.24.custom.min.js"></script>
    <script type="text/javascript" src="js/garbochess.js"></script>
    <script type="text/javascript" src="js/boardui.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script type="text/javascript">
        $(document).ready(function () { g_timeout = 1000; UINewGame(); });
    </script>
    <style type="text/css">
        #FenTextBox {
            width: 400px;
        }

        #TimePerMove {
            width: 50px;
        }

        /* =========================================================
           PIXELPLAY CHESS — PREMIUM UI
           Game logic and chess assets remain unchanged.
           ========================================================= */

        :root {
            --bg: #07090d;
            --panel: rgba(18, 20, 28, .82);
            --panel-2: rgba(24, 27, 37, .88);
            --border: rgba(255,255,255,.10);
            --text: #f8fafc;
            --muted: #a7adbb;
            --accent: #ef4444;
            --accent-soft: rgba(239,68,68,.14);
            --green: #22c55e;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 0;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-width: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(239,68,68,.13), transparent 32%),
                radial-gradient(circle at 85% 20%, rgba(34,197,94,.08), transparent 28%),
                linear-gradient(145deg, #07090d 0%, #0c0f16 52%, #07090d 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .22;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 80%);
        }


        /* Keep original chess sprites untouched */
        .no-highlight {
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        .sprite-bishop_black { background-position: 0 0; width:45px; height:45px; }
        .sprite-bishop_white { background-position: 0 -95px; width:45px; height:45px; }
        .sprite-king_black { background-position: 0 -190px; width:45px; height:45px; }
        .sprite-king_white { background-position: 0 -285px; width:45px; height:45px; }
        .sprite-knight_black { background-position: 0 -380px; width:45px; height:45px; }
        .sprite-knight_white { background-position: 0 -475px; width:45px; height:45px; }
        .sprite-pawn_black { background-position: 0 -570px; width:45px; height:45px; }
        .sprite-pawn_white { background-position: 0 -665px; width:45px; height:45px; }
        .sprite-queen_black { background-position: 0 -760px; width:45px; height:45px; }
        .sprite-queen_white { background-position: 0 -855px; width:45px; height:45px; }
        .sprite-rook_black { background-position: 0 -950px; width:45px; height:45px; }
        .sprite-rook_white { background-position: 0 -1045px; width:45px; height:45px; }

            .game-card {
                width: calc(100% - 16px);
                margin-top: 20px;
                padding: 10px;
            }

            .game-card::before {
                margin-bottom: 12px;
                font-size: 9px;
            }

            .game-card > div[align="center"] > div:first-child {
                gap: 7px;
            }

            .game-card > div[align="center"] > div:first-child .back-btn {
                min-height: 38px;
            }

            select,
            input {
                max-width: 100%;
            }

            #TimePerMove {
                width: 65px;
            }

            textarea {
                min-height: 90px;
            }
        }

        @media (max-width: 360px) {

            .game-card {
                width: calc(100% - 10px);
                padding: 7px;
            }

            .game-card > div[align="center"] > div:first-child {
                padding: 7px;
            }

            #board {
                padding: 3px;
                border-radius: 9px;
            }
        }

    </style>
</head>

<body class="pixelplay-theme">
<div class="game-card">
        <div align="center">

            <div>

                <a class="back-btn" href="javascript:UINewGame()">🎮 New Game</a>

                <select onchange="UIChangeStartPlayer()">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>

                Time per move:
                <input id="TimePerMove" value="3000" onchange="UIChangeTimePerMove()" /> ms

                <a class="back-btn" href="javascript:UIUndoMove()">↩ Undo</a>

            </div>

            <div style="margin-top:20px;">

                <div id="board"></div>

                <span id="output"></span><br />

                <textarea cols="50" rows="6" id="PgnTextBox"></textarea><br />

                <div>

                    <a id="AnalysisToggleLink" href="javascript:UIAnalyzeToggle()">

                        Analysis: Off

                    </a>

                </div>

                <br>

                FEN:
                <input id="FenTextBox" onchange="UIChangeFEN()" />

            </div>

        </div>
    </div>

</body>

</html>
