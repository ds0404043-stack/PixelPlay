<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>PixelPlay | Chess</title>
    <script type="text/javascript" src="js/jquery-1.8.2.min.js"></script>
    <script type="text/javascript" src="js/jquery-ui-1.8.24.custom.min.js"></script>
    <script type="text/javascript" src="js/garbochess.js"></script>
    <script type="text/javascript" src="js/boardui.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script type="text/javascript">
        $(document).ready(function () { g_timeout = 1000; UINewGame(); });
    </script>
    <style type="text/css">
        #FenTextBox {
            width: 400px;
        }

        #TimePerMove {
            width: 50px;
        }

        /*==============================
PIXELPLAY THEME
==============================*/

        body {

            margin: 0;

            background: #0f172a;

            color: #ffffff;

            font-family: 'Poppins', sans-serif;
        }

        .topbar {

            display: flex;

            justify-content: space-between;

            align-items: aligny;

            padding: 20px 40px;

            background: #111827;

            border-bottom: 1px solid rgba(255, 255, 255, .08);
        }

        .topbar h1 {

            margin: 0;

            color: #22c55e;

            font-size: 30px;
        }

        .back-btn {

            color: #22c55e;

            text-decoration: none;

            font-weight: 600;

            transition: .3s;
        }

        .back-btn:hover {

            opacity: .7;
        }

        .game-card {

            width: 900px;

            max-width: 95%;

            margin: 40px auto;

            background: #1e293b;

            border-radius: 20px;

            padding: 30px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
        }

        select,
        input {

            background: #0f172a;

            color: white;

            border: 1px solid #334155;

            border-radius: 8px;

            padding: 8px 12px;

            margin: 5px;
        }

        a {

            color: #22c55e;

            text-decoration: none;

            font-weight: 600;
        }

        textarea {

            width: 100%;

            max-width: 500px;

            background: #0f172a;

            color: white;

            border: 1px solid #334155;

            border-radius: 10px;

            padding: 10px;

            margin-top: 15px;
        }

        #FenTextBox {

            width: 500px;

            max-width: 100%;
        }

        #board {

            margin: 25px auto;
        }

        .no-highlight {
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        .sprite-bishop_black {
            background-position: 0 0;
            width: 45px;
            height: 45px;
        }

        .sprite-bishop_white {
            background-position: 0 -95px;
            width: 45px;
            height: 45px;
        }

        .sprite-king_black {
            background-position: 0 -190px;
            width: 45px;
            height: 45px;
        }

        .sprite-king_white {
            background-position: 0 -285px;
            width: 45px;
            height: 45px;
        }

        .sprite-knight_black {
            background-position: 0 -380px;
            width: 45px;
            height: 45px;
        }

        .sprite-knight_white {
            background-position: 0 -475px;
            width: 45px;
            height: 45px;
        }

        .sprite-pawn_black {
            background-position: 0 -570px;
            width: 45px;
            height: 45px;
        }

        .sprite-pawn_white {
            background-position: 0 -665px;
            width: 45px;
            height: 45px;
        }

        .sprite-queen_black {
            background-position: 0 -760px;
            width: 45px;
            height: 45px;
        }

        .sprite-queen_white {
            background-position: 0 -855px;
            width: 45px;
            height: 45px;
        }

        .sprite-rook_black {
            background-position: 0 -950px;
            width: 45px;
            height: 45px;
        }

        .sprite-rook_white {
            background-position: 0 -1045px;
            width: 45px;
            height: 45px;
        }
    </style>
</head>

<body class="pixelplay-theme">

    <div class="topbar">

        <a href="../../chess.html" class="back-btn">
            ← Back to PixelPlay
        </a>

        <h1>♟ Chess</h1>

    </div>

    <div class="game-card">
        <div align="center">

            <div>

                <a class="back-btn" href="javascript:UINewGame()">🎮 New Game</a>

                <select onchange="UIChangeStartPlayer()">
                    <option value="white">White</option>
                    <option value="black">Black</option>
                </select>

                Time per move:
                <input id="TimePerMove" value="3000" onchange="UIChangeTimePerMove()" /> ms

                <a class="back-btn" href="javascript:UIUndoMove()">↩ Undo</a>

            </div>

            <div style="margin-top:20px;">

                <div id="board"></div>

                <span id="output"></span><br />

                <textarea cols="50" rows="6" id="PgnTextBox"></textarea><br />

                <div>

                    <a id="AnalysisToggleLink" href="javascript:UIAnalyzeToggle()">

                        Analysis: Off

                    </a>

                </div>

                <br>

                FEN:
                <input id="FenTextBox" onchange="UIChangeFEN()" />

            </div>

        </div>
    </div>

</body>

</html>
