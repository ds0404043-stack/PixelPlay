<html>

<head>
    <base target="_blank">


    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Gill Sans", sans-serif;
            background: transparent;
        }

        .game-embed-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #274e13;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            color: white;
            text-align: center;
        }

        .button-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 20px;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }

        .logo-text {
            font-family: "Gill Sans", sans-serif;
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
            padding-bottom: 10px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .button-grid {
                grid-template-columns: 1fr;
            }

            .logo-text {
                font-size: 2rem;
            }
        }

        .c-button {
            min-height: 50px;
            appearance: none;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 15px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .btn-primary {
            background: #6aa84f;
        }

        .btn-primary:hover {
            background: #8fbc8f;
            border-color: #a2d1a2;
            transform: translateY(-2px);
        }

        .btn-alt {
            background: #073763;
        }

        .btn-alt:hover {
            background: #3d85c6;
            border-color: #6f9ac4;
            transform: translateY(-2px);
        }

        .c-button:focus {
            outline: none;
            box-shadow: 0 0 0 4px #cbd6ee;
        }

        .c-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .game-embed-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        img[src*="google-play"],
        img[src*="googleplay"],
        img[src*="app-store"],
        img[src*="appstore"],
        img[alt*="Google Play"],
        img[alt*="App Store"] {
            display: none !important;
        }
    </style>
</head>

<body data-new-gr-c-s-loaded="14.1255.0">
    <div id="gameContainer" class="game-embed-container"></div>
    <script>
        const gameContainer = document.getElementById('gameContainer');
        const buttonWrapper = document.getElementById('buttonWrapper');
        const gameXmlUrl = "m3m.xml";

        const playAltInlineBtn = document.getElementById('playAltInline');
        const playAltFullscreenBtn = document.getElementById('playAltFullscreen');
        let readyHtmlContent = null;
        async function prepareGameContent() {
            try {
                const resp = await fetch(gameXmlUrl);
                if (!resp.ok) throw new Error(`Failed to load XML: ${resp.status} ${resp.statusText}`);
                const xmlText = await resp.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "application/xml");
                const contentNode = xmlDoc.querySelector("Content");
                if (!contentNode) throw new Error("<Content> not found in XML");
                const htmlContent = contentNode.textContent;
                const doc = parser.parseFromString(htmlContent, 'text/html');

                // Remove Google Play / App Store elements, including elements
                // that the game creates later at runtime.
                const removeStoreLinks = () => {
                    const nodes = doc.querySelectorAll('a, img, iframe, div, span, button');
                    nodes.forEach(el => {
                        const text = (el.textContent || '').toLowerCase();
                        const src = (el.getAttribute('src') || '').toLowerCase();
                        const href = (el.getAttribute('href') || '').toLowerCase();
                        const aria = (el.getAttribute('aria-label') || '').toLowerCase();
                        const title = (el.getAttribute('title') || '').toLowerCase();
                        const blob = text + ' ' + src + ' ' + href + ' ' + aria + ' ' + title;

                        const isStore =
                            href.includes('play.google.com') ||
                            href.includes('apps.apple.com') ||
                            href.includes('itunes.apple.com') ||
                            src.includes('google-play') ||
                            src.includes('googleplay') ||
                            src.includes('app-store') ||
                            src.includes('appstore') ||
                            blob.includes('google play') ||
                            blob.includes('app store');

                        if (isStore) {
                            const target = el.closest('a') || el;
                            target.remove();
                        }
                    });
                };

                // Remove anything already present.
                removeStoreLinks();

                // Remove store buttons/links created dynamically by the game.
                const storeObserver = new MutationObserver(() => removeStoreLinks());
                storeObserver.observe(doc.documentElement, { childList: true, subtree: true });
                if (!doc.head) {
                    const headEl = doc.createElement('head');
                    doc.documentElement.insertBefore(headEl, doc.documentElement.firstChild);
                }
                // Force Moto X3M to fill the entire iframe.
                const fullscreenStyle = doc.createElement('style');
                fullscreenStyle.textContent = `
                    html, body {
                        width: 100vw !important;
                        height: 100vh !important;
                        margin: 0 !important;
                        padding: 0 !important;
                        overflow: hidden !important;
                    }
                    #content {
                        width: 100vw !important;
                        height: 100vh !important;
                        max-width: none !important;
                        max-height: none !important;
                    }
                `;
                (doc.head || doc.documentElement).appendChild(fullscreenStyle);

                const injectedHost = JSON.stringify(window.location.hostname);
                const injectedHref = JSON.stringify(window.location.href);
                const shimCode = `(function(){const injectedDomain=${injectedHost},injectedHref=${injectedHref},targetHosts=[];try{window.fulldomain=injectedHref,window._injected_real_host=injectedDomain}catch(e){}function shouldPatch(url){try{return!!url&&targetHosts.some(h=>-1!==url.indexOf(h))}catch(e){return!1}}function replaceDomainParam(u){try{const val=u.searchParams.get("domain");return!val||""===val.trim()||val.toLowerCase().startsWith("blob")?(u.searchParams.set("domain",injectedDomain),!0):!1}catch(e){return!1}}try{const _fetch=window.fetch;window.fetch=function(input,init){try{let urlStr=null;"string"==typeof input?urlStr=input:input instanceof Request&&(urlStr=input.url);if(urlStr&&shouldPatch(urlStr)){const uu=new URL(urlStr,location.href);replaceDomainParam(uu),"string"==typeof input?input=uu.toString():input=new Request(uu.toString(),input)}}catch(e){}return _fetch.call(this,input,init)}}catch(e){}try{const _open=XMLHttpRequest.prototype.open,_send=XMLHttpRequest.prototype.send;XMLHttpRequest.prototype.open=function(method,url,async,user,pass){try{this._shim_url=url,this._shim_method=method}catch(e){}return _open.apply(this,arguments)},XMLHttpRequest.prototype.send=function(body){try{if(this._shim_url&&shouldPatch(this._shim_url)){const uu=new URL(this._shim_url,location.href);replaceDomainParam(uu),_open.call(this,this._shim_method||"GET",uu.toString(),!0)}}catch(e){}return _send.apply(this,arguments)}}catch(e){}try{Object.defineProperty(document,"referrer",{get:function(){return injectedHref},configurable:!0})}catch(e){try{document.referrer=injectedHref}catch(e){}}})();`;
                const shimScriptTag = doc.createElement('script');
                shimScriptTag.textContent = shimCode;
                doc.head.prepend(shimScriptTag);
                const allScripts = Array.from(doc.querySelectorAll('script[src]'));
                const gameScripts = allScripts.filter(s => !s.src.toLowerCase().includes('imasdk.googleapis.com') && !s.src.toLowerCase().includes('cdn.jsdelivr.net') && !s.src.toLowerCase().includes('googletagmanager') && !s.src.toLowerCase().includes('gamemonetize.com') && !s.src.toLowerCase().includes('gamedistribution.com'));
                const mainScriptTag = gameScripts.pop();
                if (!mainScriptTag) {
                    const baseTag = doc.createElement('base');
                    baseTag.href = 'https://120164218-101451616934779516.preview.editmysite.com/uploads/b/139890129-624069120114626136/files/';
                    doc.head.prepend(baseTag);
                    readyHtmlContent = doc.documentElement.outerHTML;
                    return;
                }
                const mainJsUrl = mainScriptTag.src;
                let mainJsText = await (await fetch(mainJsUrl)).text();
                const runtimeListRegex = /runtimeScriptList\s*:\s*\[\s*["']([^"']+)["']\s*\]/;
                const runtimeMatch = mainJsText.match(runtimeListRegex);
                if (runtimeMatch) {
                    mainJsText = mainJsText.replace('scriptFolder:"scripts/"', 'scriptFolder:""');
                    const c3RuntimeUrl = runtimeMatch[1];
                    let c3RuntimeText = await (await fetch(c3RuntimeUrl)).text();
                    c3RuntimeText = c3RuntimeText.replace('new URL(fulldomain).hostname.split(".")', '(fulldomain && !fulldomain.startsWith("blob:") ? new URL(fulldomain).hostname : "localhost").split(".")');
                    c3RuntimeText = c3RuntimeText.replace('document.body.appendChild(img);', 'if (document.body) { document.body.appendChild(img); } else { window.addEventListener("DOMContentLoaded", () => document.body.appendChild(img)); }');
                    mainJsText = mainJsText.replace(runtimeListRegex, 'runtimeScriptList:[]');
                    const c3RuntimeScriptTag = doc.createElement('script');
                    c3RuntimeScriptTag.textContent = c3RuntimeText;
                    doc.head.appendChild(c3RuntimeScriptTag);
                }
                mainScriptTag.remove();
                const newMainScriptTag = doc.createElement('script');
                if (mainScriptTag.getAttribute('type') === 'module') newMainScriptTag.type = 'module';
                newMainScriptTag.textContent = mainJsText;
                (doc.body || doc.documentElement).appendChild(newMainScriptTag);
                const baseTag = doc.createElement('base');
                baseTag.href = 'https://120164218-101451616934779516.preview.editmysite.com/uploads/b/139890129-624069120114626136/files/';
                doc.head.prepend(baseTag);
                readyHtmlContent = doc.documentElement.outerHTML;
            } catch (err) {
                gameContainer.innerHTML = `<div style="color:red;padding:20px;">Error: ${err.message}</div>`;
                playAltInlineBtn.disabled = true;
                playAltFullscreenBtn.disabled = true;
            }
        }
        prepareGameContent().then(() => {
            if (readyHtmlContent) launchAltGame(true);
        });
        function launchAltGame(isInline) {
            if (!readyHtmlContent) return alert('Game is not ready yet. Please wait.');
            const blob = new Blob([readyHtmlContent], { type: 'text/html' });
            const gameUrl = URL.createObjectURL(blob);
            if (isInline) {
                gameContainer.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.src = gameUrl;
                gameContainer.appendChild(iframe);
            } else {
                const newWin = window.open(gameUrl, '_blank');
                if (!newWin) alert('Please allow popups for this site.');
            }
        }
        if (playAltInlineBtn) playAltInlineBtn.addEventListener('click', () => launchAltGame(true));
        if (playAltFullscreenBtn) playAltFullscreenBtn.addEventListener('click', () => launchAltGame(false));
    </script>
