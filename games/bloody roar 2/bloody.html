<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken 3 - PixelPlay</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100%;
            height: 100%;
        }

        #startGame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;

            padding: 16px 42px;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;

            cursor: pointer;
            border: 1px solid rgba(255, 45, 45, 0.75);
            border-radius: 4px;
            background: linear-gradient(135deg, #160000, #d40018 55%, #4a0008);
            box-shadow:
                0 0 25px rgba(255, 0, 35, 0.35),
                inset 0 0 18px rgba(255, 255, 255, 0.08);
            transition: 0.2s ease;
        }

        #startGame:hover {
            transform: translate(-50%, -50%) scale(1.04);
            box-shadow:
                0 0 35px rgba(255, 0, 35, 0.65),
                inset 0 0 20px rgba(255, 255, 255, 0.12);
        }

        #loadingBox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            width: 100%;
            height: 100%;
            box-sizing: border-box;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.08) 0%,
                    rgba(0, 0, 0, 0.24) 45%,
                    rgba(0, 0, 0, 0.78) 100%
                ),
                url("./bloody-roar-2-banner.png") center center / cover no-repeat;

            color: white;
            font-family: Arial, sans-serif;
        }

        #loadingBox::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                circle at center,
                transparent 25%,
                rgba(0, 0, 0, 0.45) 100%
            );
        }

        .loader-content {
            position: absolute;
            left: 50%;
            bottom: 6%;
            transform: translateX(-50%);
            z-index: 2;
            width: min(760px, 88%);
            text-align: center;
        }

        .loading-title {
            margin-bottom: 5px;
            font-size: clamp(18px, 2.2vw, 28px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 16px rgba(255, 25, 25, 0.8);
        }

        .loading-text {
            margin-bottom: 14px;
            color: rgba(255, 255, 255, 0.82);
            font-size: clamp(11px, 1.4vw, 15px);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .progress-track {
            width: 100%;
            height: 14px;
            padding: 2px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 55, 55, 0.65);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 0 18px rgba(255, 0, 25, 0.3);
        }

        #progressBar {
            width: 0%;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(
                90deg,
                #710008,
                #ff172f 45%,
                #ff6a45
            );
            box-shadow:
                0 0 12px rgba(255, 25, 35, 0.9),
                0 0 28px rgba(255, 20, 25, 0.45);
            transition: width 0.15s ease;
        }

        #progressText {
            margin-top: 9px;
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px #000;
        }

        .info-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .info-box {
            flex: 1;
            min-width: 0;
            padding: 10px 13px;
            box-sizing: border-box;

            background: rgba(5, 5, 5, 0.7);
            border: 1px solid rgba(255, 60, 40, 0.25);
            border-radius: 5px;
            backdrop-filter: blur(5px);

            color: rgba(255, 255, 255, 0.86);
            font-size: 11px;
            line-height: 1.45;
            text-align: left;
        }

        .info-box strong {
            color: #fff;
            letter-spacing: 0.6px;
        }

        .loader-scanline {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            opacity: 0.14;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(255, 255, 255, 0.08) 4px
            );
        }

        @media (max-width: 650px) {
            .loader-content {
                bottom: 4%;
                width: 91%;
            }

            .info-row {
                display: none;
            }

            .loading-title {
                letter-spacing: 2px;
            }

            .progress-track {
                height: 12px;
            }
        }
    </style>
</head>

<body>

    <button id="startGame">START FIGHT</button>

    <div id="loadingBox">
        <div class="loader-scanline"></div>

        <div class="loader-content">
            <div class="loading-title">UNLEASH THE BEAST...</div>

            <div class="loading-text">
                Downloading game data
            </div>

            <div class="progress-track">
                <div id="progressBar"></div>
            </div>

            <div id="progressText">
                0 / 0 MB
            </div>

            <div class="info-row">
                <div class="info-box">
                    📥 <strong>FIRST DOWNLOAD</strong><br>
                    Keep this page open while the game data is downloading.
                </div>

                <div class="info-box">
                    🎮 <strong>CONTROLS</strong><br>
                    Controls can be remapped from the emulator settings.
                </div>
            </div>
        </div>
    </div>

    <div id="game"></div>

    <script>
        EJS_player = "#game";
        EJS_core = "psx";
        EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        EJS_startOnLoaded = true;
    </script>

    <script>
        const PARTS = 13;

        const BASE_URL =
            "https://raw.githubusercontent.com/pixadu/bloody2data/main/";

        const CACHE_NAME = "bloody-roar-ii-data-v1";

        const loadingBox =
            document.getElementById("loadingBox");

        const progressBar =
            document.getElementById("progressBar");

        const progressText =
            document.getElementById("progressText");


        let downloadedBytes = 0;
        let totalBytes = 0;


        function formatMB(bytes) {

            return (bytes / (1024 * 1024)).toFixed(1);

        }


        function updateProgress() {

            const downloadedMB =
                formatMB(downloadedBytes);

            const totalMB =
                formatMB(totalBytes);

            let percent = 0;

            if (totalBytes > 0) {

                percent =
                    (downloadedBytes / totalBytes) * 100;

            }

            percent =
                Math.min(percent, 100);


            progressBar.style.width =
                percent + "%";


            progressText.textContent =
                `${downloadedMB} / ${totalMB} MB`;

        }


        async function downloadWithProgress(
            url,
            name,
            cache
        ) {

            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    name + " failed: " +
                    response.status
                );

            }


            const contentLength =
                Number(
                    response.headers.get(
                        "content-length"
                    )
                ) || 0;


            totalBytes += contentLength;

            updateProgress();


            const reader =
                response.body.getReader();


            const chunks = [];

            let received = 0;


            while (true) {

                const { done, value } =
                    await reader.read();


                if (done) break;


                chunks.push(value);


                received += value.length;

                downloadedBytes +=
                    value.length;


                updateProgress();

            }


            const blob =
                new Blob(chunks);


            const arrayBuffer =
                await blob.arrayBuffer();


            // Save downloaded data
            // for future launches
            await cache.put(
                url,
                new Response(arrayBuffer)
            );


            return arrayBuffer;

        }


        document
            .getElementById("startGame")
            .addEventListener(
                "click",
                async function () {

                    const button = this;


                    button.disabled = true;

                    button.style.display =
                        "none";


                    loadingBox.style.display =
                        "block";


                    downloadedBytes = 0;

                    totalBytes = 0;


                    updateProgress();


                    try {

                        if (
                            navigator.storage &&
                            navigator.storage.persist
                        ) {

                            await navigator.storage.persist();

                        }


                        const cache =
                            await caches.open(
                                CACHE_NAME
                            );


                        const downloads = [];


                        for (
                            let i = 1;
                            i <= PARTS;
                            i++
                        ) {

                            const name =
                                `BloodyRoarII.chd.part${String(i).padStart(3, "0")}`;


                            const url =
                                BASE_URL + name;


                            const saved =
                                await cache.match(url);


                            if (saved) {

                                console.log(
                                    "Using cached:",
                                    name
                                );


                                const buffer =
                                    await saved.arrayBuffer();


                                downloadedBytes +=
                                    buffer.byteLength;


                                totalBytes +=
                                    buffer.byteLength;


                                updateProgress();


                                downloads.push(
                                    buffer
                                );


                            } else {

                                console.log(
                                    "Downloading:",
                                    name
                                );


                                downloads.push(
                                    downloadWithProgress(
                                        url,
                                        name,
                                        cache
                                    )
                                );

                            }

                        }


                        const chunks =
                            await Promise.all(
                                downloads
                            );


                        progressBar.style.width =
                            "100%";


                        progressText.textContent =
                            `${formatMB(downloadedBytes)} / ${formatMB(totalBytes)} MB`;


                        console.log(
                            "All 19 parts ready."
                        );


                        const blob =
                            new Blob(
                                chunks,
                                {
                                    type:
                                        "application/octet-stream"
                                }
                            );


                        EJS_gameUrl =
                            URL.createObjectURL(
                                blob
                            );


                        loadingBox.style.display =
                            "none";


                        const loader =
                            document.createElement(
                                "script"
                            );


                        loader.src =
                            "https://cdn.emulatorjs.org/stable/data/loader.js";


                        document.body.appendChild(
                            loader
                        );


                    } catch (error) {

                        console.error(
                            "Bloody Roar II error:",
                            error
                        );


                        button.style.display =
                            "block";


                        button.disabled =
                            false;


                        button.textContent =
                            "START GAME";


                        loadingBox.style.display =
                            "none";


                        alert(
                            "Game loading failed. Check your internet connection and reload the site dont worry your downloaded data is safe."
                        );

                    }

                }
            );

    </script>

</body>

</html>
